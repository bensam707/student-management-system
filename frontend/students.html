<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMS | Students</title>
    <meta name="description" content="View and manage all students in the Student Management System." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ── Navigation ──────────────────────────────────────────────────────── -->
    <nav class="navbar">
        <div class="nav-brand">🎓 SMS</div>
        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="students.html" class="active">Students</a></li>
            <li><a href="add-student.html">Add Student</a></li>
        </ul>
    </nav>

    <!-- ── Main Content ────────────────────────────────────────────────────── -->
    <main class="container">
        <div class="page-header">
            <h1 class="page-title">All Students</h1>
            <a href="add-student.html" class="btn btn-primary" id="add-new-btn">+ Add Student</a>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="search-input"
                placeholder="🔍 Search students..."
            />
        </div>

        <div class="filter-box">
            <label for="department-filter">Filter by Department:</label>
            <select id="department-filter">
                <option value="">All Departments</option>
            </select>
        </div>  

        <div class="sort-box">
    <label for="sort-select">Sort by:</label>
    <select id="sort-select">
        <option value="">Default</option>
        <option value="name-asc">First Name (A-Z)</option>
        <option value="name-desc">First Name (Z-A)</option>
        <option value="department">Department (A-Z)</option>
        <option value="year-asc">Year (Low-High)</option>
        <option value="year-desc">Year (High-Low)</option>
    </select>
</div>

        <!-- Table will be populated by students.js -->
        <div class="table-wrapper">
            <table class="data-table" id="students-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="students-tbody">
                    <!-- Rows inserted by students.js -->
                    <tr><td colspan="7" class="loading-text">Loading students...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/students.js"></script>
</body>
</html>
