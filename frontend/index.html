<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMS | Dashboard</title>
    <meta name="description" content="Student Management System - Overview dashboard showing key statistics." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ── Navigation ──────────────────────────────────────────────────────── -->
    <nav class="navbar">
        <div class="nav-brand">🎓 SMS</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Dashboard</a></li>
            <li><a href="students.html">Students</a></li>
            <li><a href="add-student.html">Add Student</a></li>
        </ul>
    </nav>

    <!-- ── Main Content ────────────────────────────────────────────────────── -->
    <main class="container">
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">Welcome to the Student Management System</p>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-icon">👨‍🎓</span>
                <h2 class="stat-value" id="total-students">—</h2>
                <p class="stat-label">Total Students</p>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🏛️</span>   
                <h2 class="stat-value" id="total-departments">—</h2>
                <p class="stat-label">Departments</p>
            </div>

            <div class="stat-card">
                <span class="stat-icon">📚</span>
                <h2 class="stat-value" id="top-department">—</h2>
                <p class="stat-label">Top Department</p>
            </div>
        </div>

        <!-- Students by Department -->
        <div class="department-summary">
            <h2 class="section-title">Students by Department</h2>
            <div id="department-list">
        <p>Loading...</p>
    </div>
</div>


        <!-- Quick Actions -->
        <div class="quick-actions">
            <h2 class="section-title">Quick Actions</h2>
            <div class="action-buttons">
                <a href="students.html" class="btn btn-primary" id="view-students-btn">View All Students</a>
                <a href="add-student.html" class="btn btn-secondary" id="add-student-btn">Add New Student</a>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        // Load dashboard stats when the page loads
        async function loadDashboard() {
            const students = await API.getAllStudents();

            // Total students
            document.getElementById("total-students").textContent = students.length;

    // Total departments
        const depts = new Set(
        students.map(s => s.department).filter(Boolean)
    );
    document.getElementById("total-departments").textContent = depts.size;

    // Find the department with the most students
    const departmentCounts = {};

    students.forEach(student => {
        if (student.department) {
            departmentCounts[student.department] =
                (departmentCounts[student.department] || 0) + 1;
        }
    });

    let topDepartment = "—";
    let highestCount = 0;

    for (const department in departmentCounts) {
        if (departmentCounts[department] > highestCount) {
            highestCount = departmentCounts[department];
            topDepartment = department;
        }
    }

    document.getElementById("top-department").textContent = topDepartment;
    // Show students count for each department
const departmentList = document.getElementById("department-list");

if (Object.keys(departmentCounts).length === 0) {
    departmentList.innerHTML = "<p>No department data available.</p>";
} else {
    departmentList.innerHTML = Object.entries(departmentCounts)
        .map(([department, count]) => `
            <div class="department-item">
                <span>${department}</span>
                <strong>${count} student${count !== 1 ? "s" : ""}</strong>
            </div>
        `)
        .join("");
}
}
      loadDashboard();
    </script>
</body>
</html>
