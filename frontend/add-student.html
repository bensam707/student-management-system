<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMS | Add Student</title>
    <meta name="description" content="Add or edit a student record in the Student Management System." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ── Navigation ──────────────────────────────────────────────────────── -->
    <nav class="navbar">
        <div class="nav-brand">🎓 SMS</div>
        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="students.html">Students</a></li>
            <li><a href="add-student.html" class="active">Add Student</a></li>
        </ul>
    </nav>

    <!-- ── Main Content ────────────────────────────────────────────────────── -->
    <main class="container">
        <h1 class="page-title" id="form-title">Add New Student</h1>

        <div class="form-card">
            <!-- form.js reads ?id= from the URL to switch between Add and Edit mode -->
            <form id="student-form" novalidate>

                <div class="form-group">
                    <label for="firstName">First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" name="firstName"
                           placeholder="e.g. John" required />
                    <span class="field-error" id="firstName-error"></span>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name <span class="required">*</span></label>
                    <input type="text" id="lastName" name="lastName"
                           placeholder="e.g. Doe" required />
                    <span class="field-error" id="lastName-error"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email"
                           placeholder="e.g. john.doe@example.com" required />
                    <span class="field-error" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" name="department"
                           placeholder="e.g. Computer Science" />
                </div>

                <div class="form-group">
                    <label for="year">Year of Study</label>
                    <select id="year" name="year">
                        <option value="">-- Select Year --</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submit-btn">Save Student</button>
                    <a href="students.html" class="btn btn-secondary" id="cancel-btn">Cancel</a>
                </div>

            </form>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/form.js"></script>
</body>
</html>
