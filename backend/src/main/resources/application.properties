# ─── Server ───────────────────────────────────────────────────────────────────
# Port on which the Spring Boot app will run
server.port=${PORT:8080}

# ─── Database (MySQL) ────────────────────────────────────────────────────────
# Make sure MySQL is running and the database exists:
#   CREATE DATABASE student_management;
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# update  → creates/alters tables automatically (good for development)
# validate → only checks schema without changing it (use for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.sms=DEBUG
